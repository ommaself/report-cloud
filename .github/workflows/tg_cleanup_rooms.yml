name: tg-cleanup-rooms
# 11/25 대표 지시(15:12·15:21): 잘못 나간 히트맵 모두에게서 삭제 — 방마다 동시에(수동 실행 전용)
on:
  workflow_dispatch:
    inputs:
      rooms: {description: "방 번호(쉼표)", default: "2,3,4,5,6,7,8"}
      file: {description: "파일 이름", default: "heatmap_US.html"}
      start: {description: "보낸 시각 시작(UTC)", default: "2026-11-25T04:58:00"}
      end: {description: "보낸 시각 끝(UTC)", default: "2026-11-25T05:02:00"}
      miss: {description: "슈퍼그룹 위쪽 끝 찾기 연속 없음 기준", default: "60"}
      span: {description: "아래로 훑을 개수", default: "6000"}
      diag: {description: "점검 출력 개수", default: "0"}
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        room: ${{ fromJSON(format('[{0}]', inputs.rooms)) }}
    name: room-${{ matrix.room }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q requests==2.32.3
      - env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TOP_MISS: ${{ inputs.miss }}
          DIAG: ${{ inputs.diag }}
        run: python -I -u common/tg_cleanup.py --rooms "${{ matrix.room }}" --file "${{ inputs.file }}" --start "${{ inputs.start }}" --end "${{ inputs.end }}" --span "${{ inputs.span }}"
