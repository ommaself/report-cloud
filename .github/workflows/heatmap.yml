name: heatmap
# 국장: 평일 16:40 KST(07:40 UTC) / 미장: 평일 장 마감 뒤 07:30 KST(22:30 UTC, 전날 미장)
# 공개 안 함(11/25 대표: 비공개 + 텔레 방 발송). 결과 HTML은 실행 기록(Artifacts)에도 30일
on:
  schedule:
    - cron: "40 7 * * 1-5"   # 국장 16:40 KST
    - cron: "20 8 * * 1-5"   # 국장 예비
    - cron: "0 9 * * 1-5"    # 국장 예비
    - cron: "30 22 * * 1-5"  # 미장 07:30 KST
    - cron: "10 23 * * 1-5"  # 미장 예비
    - cron: "50 23 * * 1-5"  # 미장 예비
  workflow_dispatch:
    inputs:
      market:
        description: "US / KR / both(합본 1개)"
        default: both
      rooms:
        description: "보낼 방 번호(rooms.json), 비우면 저장소 변수 HEATMAP_ROOMS"
        default: "1"
      dry:
        description: "yes = 만들기만(발송 안 함), no = 실제 발송"
        default: "yes"
permissions:
  contents: read
concurrency:
  group: heatmap
  cancel-in-progress: false
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash common/guard.sh heatmap.yml 150
  build:
    needs: guard
    if: needs.guard.outputs.go == '1'
    permissions:
      contents: write   # out 브랜치에 보낸 판 저장(main은 안 건드림)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: heatmap/requirements.txt
      - run: pip install -r heatmap/requirements.txt -r common/requirements.txt
      - name: pick market
        id: m
        run: |
          M="${{ github.event.inputs.market }}"
          if [ -z "$M" ]; then
            H=$(date -u +%-H); if [ "$H" -ge 6 ] && [ "$H" -lt 15 ]; then M=KR; else M=both; fi  # 국장 단독 07:40~09:00 UTC(지연 포함), 아침 07:30 KST = 미장+국장 합본(11/25 대표 A안)
          fi
          echo "market=$M" >> "$GITHUB_OUTPUT"
      - name: KR
        if: steps.m.outputs.market == 'KR' || steps.m.outputs.market == 'both'
        run: python -I heatmap/heatmap_web.py --market KR --out out/heatmap_KR.html
      - name: US
        if: steps.m.outputs.market == 'US' || steps.m.outputs.market == 'both'
        run: python -I heatmap/heatmap_web.py --market US --out out/heatmap_US.html
      - name: check (김진·KJ·네이버 0건)
        run: |
          # 압축 봉 자료(영문·숫자 문자열) 속 우연한 KJ·naver는 빼고, 낱말로 나온 것만 잡음
          ! grep -lP "김진|(?<![A-Za-z0-9_-])(KJ|naver)(?![A-Za-z0-9_-])" out/*.html
      # 발송 스위치: 저장소 변수 HEATMAP_SEND = on 일 때만(대표 '승인' 뒤에 켬). 방 = common/rooms.json 번호(저장소 변수 HEATMAP_ROOMS, 기본 1 = 내 방만): 1 내 방 2 투자 아이디어 3 금요일 온라인 스터디 4 일정매매 5 KIC 6 송도스터디(SCV) 7 모닝레터 8 추추클럽(11/25 대표 '그냥 모든 방에 진행해').
      # 수동 실행은 dry=no 일 때만 발송(11/25 시험 실행 오발송 재발 방지). 예약 실행: 그 시장 휴장일이면 안 보냄. 기준일 ≠ 직전 거래일이면 발송 중단 + 내 방 [중단] 경고(11/25 대표 재발 금지 원칙). 수동 실제 발송(dry=no)도 기준일 검사(휴장일 건너뛰기만 안 함).
      - name: combine (합본, 미장+국장)
        if: steps.m.outputs.market == 'both'
        run: python -I common/combine.py out/heatmap_US.html out/heatmap_KR.html out/heatmap.html out/index.html
      - name: send
        if: vars.HEATMAP_SEND == 'on' && github.event.inputs.dry != 'yes'
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        run: bash common/heatmap_send.sh "${{ steps.m.outputs.market }}" "${{ github.event.inputs.rooms || vars.HEATMAP_ROOMS || '1' }}" "${{ github.event_name }}"
      # 실패 알림: 만들기·검사·발송 중 하나라도 실패하면 내 방(rooms.json 1번)에 한 줄
      - name: alert on failure
        if: failure() && vars.HEATMAP_SEND == 'on' && env.ALERTED != '1' && (github.event_name == 'schedule' || github.event.inputs.dry == 'no')
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        run: python -I common/tg_alert.py "[깃허브] 히트맵 ${{ steps.m.outputs.market }} 실패 · 실행 기록 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      # 사이드 Artifact 연동(11/25 대표 '연동해야지'): 실제로 보낸 판만 비공개 브랜치 out에 덮어씀(KR·US 따로) + build_시장.json
      - name: publish to out branch
        if: success() && ((vars.HEATMAP_SEND == 'on' && (github.event_name == 'schedule' || github.event.inputs.dry == 'no')) || github.ref_name != 'main')
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          OUTB: ${{ github.ref_name == 'main' && 'out' || 'out-test' }}   # main이 아닌 브랜치 시험은 out-test에만
        run: |
          # 저장 실패는 발송과 별개: 잡은 안 실패시키고 내 방에 한 줄(사이드 연동 안 됨 표시)
          bash common/publish_out.sh "${{ steps.m.outputs.market }}" "${{ github.event.inputs.rooms || vars.HEATMAP_ROOMS || '1' }}" || { echo "out 저장 실패"; if [ "${{ github.ref_name }}" = main ]; then python -I common/tg_alert.py "[깃허브] 히트맵 out 저장 실패(발송은 됨, 사이드 연동 안 됨) · https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"; fi; }
      - uses: actions/upload-artifact@v4
        with:
          name: heatmap-${{ steps.m.outputs.market }}-${{ github.run_number }}
          path: out/*.html
          retention-days: 30
