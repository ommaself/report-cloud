name: heatmap
# 국장: 평일 16:40 KST(07:40 UTC) / 미장: 평일 장 마감 뒤 07:30 KST(22:30 UTC, 전날 미장)
# 공개 안 함(11/25 대표: 비공개 + 텔레 방 발송). 결과 HTML은 실행 기록(Artifacts)에도 30일
on:
  schedule:
    - cron: "40 7 * * 1-5"   # 국장 16:40 KST
    - cron: "20 8 * * 1-5"   # 국장 예비
    - cron: "0 9 * * 1-5"    # 국장 예비
    - cron: "30 22 * * 1-5"  # 미장 07:30 KST
    - cron: "10 23 * * 1-5"  # 미장 예비
    - cron: "50 23 * * 1-5"  # 미장 예비
  workflow_dispatch:
    inputs:
      market:
        description: "US / KR / both"
        default: both
      rooms:
        description: "보낼 방 번호(rooms.json), 비우면 저장소 변수 HEATMAP_ROOMS"
        default: "1"
      dry:
        description: "yes = 만들기만(발송 안 함), no = 실제 발송"
        default: "yes"
permissions:
  contents: read
concurrency:
  group: heatmap
  cancel-in-progress: false
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash common/guard.sh heatmap.yml 150
  build:
    needs: guard
    if: needs.guard.outputs.go == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: heatmap/requirements.txt
      - run: pip install -r heatmap/requirements.txt -r common/requirements.txt
      - name: pick market
        id: m
        run: |
          M="${{ github.event.inputs.market }}"
          if [ -z "$M" ]; then
            H=$(date -u +%-H); if [ "$H" -ge 6 ] && [ "$H" -lt 15 ]; then M=KR; else M=US; fi  # 국장 07:40~09:00 UTC(지연 포함), 미장 22:30~23:50 UTC
          fi
          echo "market=$M" >> "$GITHUB_OUTPUT"
      - name: KR
        if: steps.m.outputs.market == 'KR' || steps.m.outputs.market == 'both'
        run: python -I heatmap/heatmap_web.py --market KR --out out/heatmap_KR.html
      - name: US
        if: steps.m.outputs.market == 'US' || steps.m.outputs.market == 'both'
        run: python -I heatmap/heatmap_web.py --market US --out out/heatmap_US.html
      - name: check (김진·KJ·네이버 0건)
        run: |
          grep -oE ".{0,60}(김진|KJ|naver).{0,60}" out/*.html | sort | uniq -c | head -20 || true
          ! grep -lE "김진|KJ|naver" out/*.html
      # 발송 스위치: 저장소 변수 HEATMAP_SEND = on 일 때만(대표 '승인' 뒤에 켬). 방 = common/rooms.json 번호(저장소 변수 HEATMAP_ROOMS, 기본 1 = 내 방만): 1 내 방 2 투자 아이디어 3 금요일 온라인 스터디 4 일정매매 5 KIC 6 송도스터디(SCV) 7 모닝레터 8 추추클럽(11/25 대표 '그냥 모든 방에 진행해').
      # 수동 실행은 dry=no 일 때만 발송(11/25 시험 실행 오발송 재발 방지). 예약 실행: 그 시장 휴장일이면 안 보냄. 기준일 ≠ 직전 거래일이면 발송 중단 + 내 방 [중단] 경고(11/25 대표 재발 금지 원칙). 수동 실제 발송(dry=no)도 기준일 검사(휴장일 건너뛰기만 안 함).
      - name: send KR
        if: vars.HEATMAP_SEND == 'on' && github.event.inputs.dry != 'yes' && (steps.m.outputs.market == 'KR' || steps.m.outputs.market == 'both')
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        run: |
          MODE=""; if [ "${{ github.event_name }}" != "schedule" ]; then MODE=manual; fi
          set +e; MSG=$(python -I common/heatmap_check.py out/heatmap_KR.html KR $MODE); RC=$?; set -e; echo "$MSG"
          if [ $RC -eq 2 ]; then exit 0; fi
          if [ $RC -ne 0 ]; then python -I common/tg_alert.py "$MSG"; exit 1; fi
          python -I common/tg_send.py --file out/heatmap_KR.html --rooms "${{ github.event.inputs.rooms || vars.HEATMAP_ROOMS || '1' }}" --caption "$(python -I common/caption.py out/heatmap_KR.html '국내 히트맵')"
      - name: send US
        if: vars.HEATMAP_SEND == 'on' && github.event.inputs.dry != 'yes' && (steps.m.outputs.market == 'US' || steps.m.outputs.market == 'both')
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        run: |
          MODE=""; if [ "${{ github.event_name }}" != "schedule" ]; then MODE=manual; fi
          set +e; MSG=$(python -I common/heatmap_check.py out/heatmap_US.html US $MODE); RC=$?; set -e; echo "$MSG"
          if [ $RC -eq 2 ]; then exit 0; fi
          if [ $RC -ne 0 ]; then python -I common/tg_alert.py "$MSG"; exit 1; fi
          python -I common/tg_send.py --file out/heatmap_US.html --rooms "${{ github.event.inputs.rooms || vars.HEATMAP_ROOMS || '1' }}" --caption "$(python -I common/caption.py out/heatmap_US.html 'S&P500 히트맵')"
      # 실패 알림: 만들기·검사·발송 중 하나라도 실패하면 내 방(rooms.json 1번)에 한 줄
      - name: alert on failure
        if: failure() && vars.HEATMAP_SEND == 'on' && env.ALERTED != '1' && (github.event_name == 'schedule' || github.event.inputs.dry == 'no')
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        run: python -I common/tg_alert.py "[깃허브] 히트맵 ${{ steps.m.outputs.market }} 실패 · 실행 기록 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - uses: actions/upload-artifact@v4
        with:
          name: heatmap-${{ steps.m.outputs.market }}-${{ github.run_number }}
          path: out/*.html
          retention-days: 30
