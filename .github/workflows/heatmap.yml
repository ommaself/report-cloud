name: heatmap
# 국장: 평일 16:40 KST(07:40 UTC) / 미장: 평일 장 마감 뒤 07:30 KST(22:30 UTC, 전날 미장)
# 아직 공개 안 함: 결과 HTML은 이 비공개 저장소 실행 기록(Artifacts)에만 남김
on:
  schedule:
    - cron: "40 7 * * 1-5"
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      market:
        description: "US / KR / both"
        default: both
permissions:
  contents: read
concurrency:
  group: heatmap
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: heatmap/requirements.txt
      - run: pip install -r heatmap/requirements.txt
      - name: pick market
        id: m
        run: |
          M="${{ github.event.inputs.market }}"
          if [ -z "$M" ]; then
            if [ "${{ github.event.schedule }}" = "40 7 * * 1-5" ]; then M=KR; else M=US; fi
          fi
          echo "market=$M" >> "$GITHUB_OUTPUT"
      - name: KR
        if: steps.m.outputs.market == 'KR' || steps.m.outputs.market == 'both'
        run: python -I heatmap/heatmap_web.py --market KR --out out/heatmap_KR.html
      - name: US
        if: steps.m.outputs.market == 'US' || steps.m.outputs.market == 'both'
        run: python -I heatmap/heatmap_web.py --market US --out out/heatmap_US.html
      - name: check (김진·KJ·네이버 0건)
        run: |
          ! grep -lE "김진|KJ|naver" out/*.html
      - uses: actions/upload-artifact@v4
        with:
          name: heatmap-${{ steps.m.outputs.market }}-${{ github.run_number }}
          path: out/*.html
          retention-days: 30
